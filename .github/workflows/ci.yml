name: MCP-SSH-TOOL CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Protocol Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
          pip install mcp paramiko pytest pytest-asyncio flake8
        shell: bash

      - name: Lint with Flake8
        run: |
          flake8 server/src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server/src --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
        shell: bash

      - name: Run Test Suite
        run: |
          cd server
          python -m unittest discover -s tests -v
        shell: bash
